name: Train Skin Model

on:
  push:
    paths: ['data/raw_inputs/**', 'data/raw_targets/**', 'scripts/**', '.github/workflows/train.yml']
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: { python-version: '3.10' }
    
    - name: Install Deps
      run: pip install -r requirements.txt
      
    - name: 1. Crop & Align
      run: python scripts/auto_align_crop.py
      
    - name: 2. Generate Data
      run: python scripts/generate_pairs.py
      
    - name: 3. Train Model
      run: python scripts/train_model.py
      
    - name: 4. Export ONNX
      run: python scripts/export_ncnn.py
      
    - name: 5. Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: trained-model
        path: |
          best_model.pth
          skin_enhancer.onnx
        retention-days: 30
