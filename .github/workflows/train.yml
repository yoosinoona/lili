name: Train Skin Model

on:
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug Files
        run: |
          echo "=== File structure ==="
          find . -name "*.png" -o -name "*.jpg" | head -20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install torch torchvision opencv-python numpy onnx onnxruntime pillow

      - name: Run Scripts
        run: |
          python scripts/auto_align_crop.py
          python scripts/generate_pairs.py
          python scripts/train_model.py
          python scripts/export_ncnn.py

      - name: Convert to NCNN
        run: |
          wget -q https://github.com/Tencent/ncnn/releases/download/20240410/ncnn-20240410-ubuntu-2004.zip
          unzip -q ncnn-*.zip
          NCNN_DIR=$(ls -d ncnn-*)
          ./$NCNN_DIR/bin/onnx2ncnn skin_enhancer.onnx skin_enhancer.param skin_enhancer.bin
          ./$NCNN_DIR/bin/ncnnoptimize skin_enhancer.param skin_enhancer.bin skin_enhancer.param skin_enhancer.bin 65536

      - name: Upload Model
        uses: actions/upload-artifact@v4
        with:
          name: skin-model-ncnn
          path: |
            skin_enhancer.param
            skin_enhancer.bin
