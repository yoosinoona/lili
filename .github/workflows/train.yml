name: Train Skin Model & Convert PNNX

on:
  workflow_dispatch:

jobs:
  train-and-convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug Files
        run: |
          echo "=== Checking raw images ==="
          find data/raw_inputs -type f | wc -l
          find data/raw_targets -type f | wc -l

      - name: Setup Python
        uses: actions/setup-python@v5
        with: { python-version: '3.10' }

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Pipeline
        run: |
          python scripts/auto_align_crop.py
          python scripts/generate_pairs.py
          python scripts/train_model.py

      - name: Convert to NCNN via PNNX (Auto-Latest)
        run: |
          echo "🔍 Fetching latest PNNX release URL..."
          PNNX_URL=$(curl -s https://api.github.com/repos/nihui/pnnx/releases/latest | grep "browser_download_url.*ubuntu" | head -n 1 | sed 's/.*"browser_download_url": "//;s/".*//')
          if [ -z "$PNNX_URL" ]; then echo "❌ Không tìm thấy link PNNX"; exit 1; fi
          
          echo "⬇️ Downloading PNNX..."
          wget -q "$PNNX_URL"
          unzip -q *.zip
          
          PNNX_BIN=$(find . -name "pnnx" -type f | head -n 1)
          chmod +x "$PNNX_BIN"
          
          echo "🔄 Converting PyTorch -> NCNN (FP16)..."
          "$PNNX_BIN" best_model.pt inputshape=[1,4,128,128] fp16=1
          
          echo "✅ NCNN files generated:"
          ls -lh *.param *.bin

      - name: Upload Model
        uses: actions/upload-artifact@v4
        with:
          name: skin-model-ncnn
          path: |
            best_model.ncnn.param
            best_model.ncnn.bin
          retention-days: 30
